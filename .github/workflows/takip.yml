name: e-Yaygin Kurs Takip

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

jobs:
  kontrol:
    runs-on: ubuntu-latest
    steps:
      - name: Depoyu çek
        uses: actions/checkout@v4

      - name: Python kur
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Gerekli kütüphaneleri kur
        run: |
          pip install playwright requests
          playwright install chromium

      - name: e-Yaygın Betiğini Çalıştır
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
        run: python kontrol.py

      - name: Kamu İlan Sitelerini Tara
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          ILANGOV_TELEGRAM_TOKEN: ${{ secrets.ILANGOV_TELEGRAM_TOKEN }}
          ISKUR_TELEGRAM_TOKEN: ${{ secrets.ISKUR_TELEGRAM_TOKEN }}
          SCU_TELEGRAM_TOKEN: ${{ secrets.SCU_TELEGRAM_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
        run: python ilan_takip.py

      - name: Görülen İlanları Kaydet
        run: |
          git config --local user.email "actions@github.com"
          git config --local user.name "GitHub Actions"
          git add gorulen_ilanlar.json || true
          git diff --quiet && git diff --staged --quiet || (git commit -m "Yeni ilan kaydı güncellendi" && git push)
